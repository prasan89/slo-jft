applications:
  - name: slo-jft-dashboard
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /health
    services:
      - jft-hana
    env:
      SCANNER_SECRET: ((SCANNER_SECRET))

  - name: slo-jft-scanner
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python scanner_worker.py
    health-check-type: process
    services:
      - jft-hana
    env:
      DASHBOARD_URL: ((DASHBOARD_URL))
      SCANNER_SECRET: ((SCANNER_SECRET))
      GROWW_API_KEY: ((GROWW_API_KEY))
      GROWW_API_SECRET: ((GROWW_API_SECRET))
      SCANNER_INTERVAL_SECONDS: 300
