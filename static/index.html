<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFT R3 / S3 Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf7;font-family:Inter,system-ui,-apple-system,sans-serif}header{padding:20px 28px;border-bottom:1px solid #202943;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.sub{color:#8f9ab3;font-size:13px;margin-top:4px}.live{color:#55d98a;font-size:13px}.wrap{padding:22px 28px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:#11182a;border:1px solid #222d46;border-radius:12px}.card{padding:16px}.label{font-size:12px;color:#8f9ab3}.value{font-size:24px;font-weight:700;margin-top:8px}.green{color:#55d98a}.red{color:#ff6b78}.tablewrap{overflow:auto}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 14px}.table{width:100%;border-collapse:collapse;min-width:1250px}.table th{color:#7f8aa5;font-size:11px;text-transform:uppercase;text-align:left;padding:11px;border-bottom:1px solid #28334c}.table td{padding:12px 11px;border-bottom:1px solid #1e2940;font-size:13px}.badge{padding:5px 9px;border-radius:20px;font-weight:700;font-size:11px}.buy{background:#123b2b;color:#55d98a}.sell{background:#431e28;color:#ff7180}.open{background:#202d4a;color:#8db6ff}.closed{background:#292d36;color:#aab3c5}.small{font-size:11px;color:#7f8aa5}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><h1>JFT R3 / S3 Signal Dashboard</h1><div class="sub">BUY = R3 breakout · SL = R2 &nbsp;|&nbsp; SELL = S3 breakdown · SL = S2 &nbsp;|&nbsp; scan every 5 minutes</div></div><div class="live">● LIVE GROWW SCANNER</div></header>
<div class="wrap">
<div class="cards"><div class="card"><div class="label">TOTAL SIGNALS</div><div id="total" class="value">0</div></div><div class="card"><div class="label">OPEN</div><div id="open" class="value">0</div></div><div class="card"><div class="label">CLOSED</div><div id="closed" class="value">0</div></div><div class="card"><div class="label">TOTAL P&L</div><div id="pnl" class="value">₹0.00</div></div><div class="card"><div class="label">WIN RATE</div><div id="win" class="value">0.0%</div></div></div>
<div class="panel"><h2>Signals</h2><div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Symbol</th><th>Signal</th><th>Entry</th><th>SL</th><th>R3</th><th>R2</th><th>R1</th><th>S1</th><th>S2</th><th>S3</th><th>LTP</th><th>P&L</th><th>P&L %</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function refresh(){
 const [s,st]=await Promise.all([fetch('/api/signals').then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);
 document.querySelector('#total').textContent=st.total;document.querySelector('#open').textContent=st.open;document.querySelector('#closed').textContent=st.closed;document.querySelector('#pnl').textContent='₹'+fmt(st.pnl);document.querySelector('#pnl').className='value '+(st.pnl>=0?'green':'red');document.querySelector('#win').textContent=fmt(st.win_rate)+'%';
 document.querySelector('#rows').innerHTML=s.map(x=>`<tr><td>${new Date(x.signal_time).toLocaleString()}</td><td><b>${x.symbol}</b><div class="small">${x.timeframe||''}</div></td><td><span class="badge ${x.side==='BUY'?'buy':'sell'}">${x.side}</span></td><td>${fmt(x.entry)}</td><td>${fmt(x.stop_loss)}</td><td>${fmt(x.r3)}</td><td>${fmt(x.r2)}</td><td>${fmt(x.r1)}</td><td>${fmt(x.s1)}</td><td>${fmt(x.s2)}</td><td>${fmt(x.s3)}</td><td>${fmt(x.ltp)}</td><td class="${x.pnl>=0?'green':'red'}"><b>${fmt(x.pnl)}</b></td><td class="${x.pnl_pct>=0?'green':'red'}">${fmt(x.pnl_pct)}%</td><td><span class="badge ${x.status==='OPEN'?'open':'closed'}">${x.status}</span></td></tr>`).join('');
}
refresh();setInterval(refresh,3000);
</script>
</body></html>
